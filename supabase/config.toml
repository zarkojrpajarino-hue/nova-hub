# I15.FIX.7 — verify_jwt = false para todas las edge functions.
# Este proyecto usa ES256 (ECDSA asimétrico). El gateway de Supabase verifica
# con HS256 por defecto → incompatible. Cada función valida el JWT internamente
# con validateAuth() propio. Sin esta configuración, cada `supabase functions deploy`
# resetea verify_jwt a true y rompe la auth silenciosamente.

